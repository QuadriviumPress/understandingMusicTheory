      children:
        - file: chapters/ch-25-acoustics-for-music-theory.md
        - file: chapters/ch-26-standing-waves-and-musical-instruments.md
        - file: chapters/ch-27-harmonic-series-i-timbre-and-octaves.md
    - title: "Part V — Notes, Keys, and Scales"
      children:
