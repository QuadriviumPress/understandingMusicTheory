version: 1
project:
  id: understanding-music-theory
  title: Understanding Music Theory
  subtitle: Notation, Sound, Scales, Harmony, and Musicianship
  short_title: Music Theory
  description: >-
    An approachable, media-rich introduction to music notation, acoustics,
    scales, intervals, harmony, form, ear training, and transposition.
  authors:
    - name: Catherine Schmidt-Jones
  editors:
    - name:
        literal: QuadriviumPress
  license: CC-BY-2.0
  open_access: true
  github: QuadriviumPress/understandingMusicTheory
  keywords:
    - music theory
    - music notation
    - harmony
    - scales and intervals
    - ear training
    - open textbook
  numbering:
    headings: true
    figure: true
    table: true
  # Remote hosts often answer 403, 404, or 5xx to the CI checker even when the
  # page is fine in a browser. Internal links and missing files still fail.
  error_rules:
    - rule: link-resolves
      severity: ignore
      keys:
        - "{http,https}://**"
    - rule: doi-link-valid
      severity: ignore
  toc:
    - file: index.md
    - file: front/introduction.md
    - title: "Part I — Reading Music: Pitch"
      children:
        - file: chapters/ch-01-the-staff.md
        - file: chapters/ch-02-clef.md
        - file: chapters/ch-03-pitch-sharp-flat-and-natural-notes.md
        - file: chapters/ch-04-key-signature.md
        - file: chapters/ch-05-enharmonic-spelling.md
    - title: "Part II — Reading Music: Time and Expression"
      children:
        - file: chapters/ch-06-duration-note-lengths-in-written-music.md
        - file: chapters/ch-07-duration-rest-length.md
        - file: chapters/ch-08-time-signature.md
        - file: chapters/ch-09-meter.md
        - file: chapters/ch-10-pickup-notes-and-measures.md
        - file: chapters/ch-11-dots-ties-and-borrowed-divisions.md
        - file: chapters/ch-12-syncopation.md
        - file: chapters/ch-13-tempo.md
        - file: chapters/ch-14-repeats-and-other-musical-road-map-signs.md
        - file: chapters/ch-15-dynamics-and-accents.md
        - file: chapters/ch-16-articulation.md
    - title: "Part III — The Elements of Music"
      children:
        - file: chapters/ch-17-rhythm.md
        - file: chapters/ch-18-timbre.md
        - file: chapters/ch-19-melody.md
        - file: chapters/ch-20-texture.md
        - file: chapters/ch-21-harmony.md
        - file: chapters/ch-22-counterpoint.md
        - file: chapters/ch-23-range.md
        - file: chapters/ch-24-classifying-music.md
